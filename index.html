<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17363A">
<title>Tienes una tarjeta 🧸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root {
    --fondo: #17363A;
    --fondo-luz: #2C5B5D;
    --miel: #C68B59;
    --miel-osc: #8A5A33;
    --coral: #FF7A59;
    --oro: #FFC857;
    --papel: #FFF8EE;
    --tinta: #22302F;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mano: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 32%, rgba(255,200,87,.18) 0, transparent 38%),
      radial-gradient(ellipse at 50% 30%, var(--fondo-luz) 0%, var(--fondo) 70%);
    color: var(--papel); font-family: var(--sans); -webkit-tap-highlight-color: transparent;
  }
  #camara, #escena { position: fixed; inset: 0; width: 100%; height: 100%; }
  #camara { object-fit: cover; z-index: 0; display: none; }
  #escena { z-index: 1; touch-action: none; }

  /* ---------- Portada ---------- */
  #portada {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 28px calc(24px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(ellipse at 50% 35%, #2E5A5E 0%, #1E3B3F 72%);
    text-align: center; transition: opacity .7s ease, transform .7s ease;
  }
  #portada.oculta { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .caja { font-size: 84px; line-height: 1; margin-bottom: 32px; animation: mecer 3s ease-in-out infinite; }
  @keyframes mecer { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-6px); } }
  #portada h1 { font: 500 clamp(2rem, 8vw, 2.7rem)/1.12 var(--serif); max-width: 15ch; }
  #portada .para { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--oro); margin-top: 14px; }
  #boton-abrir {
    margin-top: 38px; font: 600 1.05rem var(--sans); color: var(--tinta); background: var(--oro);
    border: 0; border-radius: 999px; padding: 17px 32px; cursor: pointer; transition: transform .15s ease;
  }
  #boton-abrir:active { transform: scale(.96); }
  #boton-abrir:focus-visible { outline: 3px solid var(--papel); outline-offset: 3px; }
  #portada .nota { margin-top: 18px; font-size: .9rem; opacity: .7; max-width: 30ch; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { .caja { animation: none; } }

  /* Botones de la tarjeta */
  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 1.05rem var(--sans); border: 0; border-radius: 16px; padding: 17px 30px; cursor: pointer; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .boton:active { transform: translateY(4px); }
  .boton:focus-visible, .boton-sec:focus-visible { outline: 3px solid var(--papel); outline-offset: 4px; }

  /* ---------- Durante la experiencia ---------- */
  #pista {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top, 0px));
    background: rgba(23,54,58,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 10px 18px; border-radius: 999px; font-size: .9rem; white-space: nowrap;
    opacity: 0; transition: opacity .6s ease; pointer-events: none;
  }
  #pista.visible { opacity: 1; }

  /* Tarjeta de papel */
  #tarjeta {
    position: fixed; z-index: 3; left: 14px; right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: 460px; margin: 0 auto;
    background: var(--papel); color: var(--tinta);
    border-radius: 6px; padding: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    transform: translateY(130%) rotate(2deg); transition: transform .9s cubic-bezier(.2,.9,.3,1.12);
  }
  #tarjeta.visible { transform: translateY(0) rotate(-1deg); }
  #tarjeta.minimizada { transform: translateY(calc(100% - 64px)) rotate(0deg); }
  .marco { border: 1.5px solid #E7D5BD; border-radius: 3px; padding: 20px 20px 14px; position: relative; }
  .estampilla {
    position: absolute; top: -4px; right: 12px; width: 54px; height: 64px;
    background: var(--coral); color: var(--papel);
    display: grid; place-items: center; font: 650 1.4rem var(--serif);
    -webkit-mask: radial-gradient(circle at 4px 4px, transparent 3px, #000 3.5px) -4px -4px / 8px 8px;
            mask: radial-gradient(circle at 4px 4px, transparent 3px, #000 3.5px) -4px -4px / 8px 8px;
    transform: rotate(6deg);
  }
  .estampilla span { font-size: .6rem; font-family: var(--sans); font-weight: 600; display: block; text-align: center; margin-top: -6px; }
  .cabecera { display: flex; align-items: center; gap: 12px; padding-right: 64px; }
  #foto { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid var(--oro); display: none; flex-shrink: 0; }
  .para-texto { font: 650 1.45rem/1.15 var(--serif); }
  #texto { font: 400 1.04rem/1.62 var(--serif); margin-top: 12px; min-height: 3.2em; max-height: 30vh; overflow-y: auto; }
  #firma { font: 600 1.75rem/1 var(--mano); color: var(--miel-osc); margin-top: 8px; text-align: right; opacity: 0; transition: opacity .6s ease; }
  #firma.visible { opacity: 1; }
  #zona-ar { margin-top: 14px; display: none; }
  #zona-ar.lista { display: block; }
  #zona-ar a { display: block; }
  #zona-ar a.boton { width: 100%; background: var(--coral); color: #fff; box-shadow: 0 6px 0 #C9543A; }
  #zona-ar a img { display: block; width: 100%; height: auto; }
  .acciones { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
  .acciones small { font-size: .8rem; opacity: .6; }
  .boton-sec { font: 600 .85rem var(--sans); color: var(--tinta); background: #F1E4D1; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) { #tarjeta, #portada { transition: none; } }
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  $("para-inicio").textContent = "Para " + TARJETA.para;
  $("para-texto").textContent = "Para " + TARJETA.para;
  $("firma").textContent = "Un abrazo, " + TARJETA.de;
  if (TARJETA.foto) { $("foto").src = TARJETA.foto; $("foto").style.display = "block"; }

  const COLORES = [0xFFC857, 0xFF7A59, 0x7FD1C7, 0xB8A1FF, 0xFFE3A3];
  const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Escena ----------
  const canvas = $("escena");
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.rotation.order = "YXZ";
  scene.add(new THREE.HemisphereLight(0xFFF3E0, 0x3A2A20, 0.75));
  const sol = new THREE.DirectionalLight(0xFFFFFF, 0.8); sol.position.set(1.5, 3, 3); scene.add(sol);
  const contra = new THREE.DirectionalLight(0xFFD9A8, 0.45); contra.position.set(-2, 1.5, -2); scene.add(contra);

  // Contenedor del osito (en la portada queda centrado arriba)
  const ancla = new THREE.Group();
  scene.add(ancla);
  let osito = null, brazo = null;

  // Sombra suave bajo el osito
  const cSombra = document.createElement("canvas"); cSombra.width = cSombra.height = 128;
  const g = cSombra.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(0,0,0,.45)"); grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const sombra = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cSombra), transparent: true, depthWrite: false }));
  sombra.rotation.x = -Math.PI / 2; sombra.position.y = 0.005;
  ancla.add(sombra);

  function base64ABuffer(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  new THREE.GLTFLoader().parse(base64ABuffer(OSITO_GLB), "", gltf => {
    osito = gltf.scene;
    osito.scale.setScalar(4.3);          // el modelo mide 30 cm; aquí se ve grande
    osito.traverse(o => {
      if (o.isMesh) {
        const m = o.material;
        if (m.roughness > 0.85) { m.roughness = 1; m.emissive = m.color.clone(); m.emissiveIntensity = 0.06; }
      }
    });
    brazo = osito.getObjectByName("hombro_der");
    ancla.add(osito);
  }, err => console.error("No se pudo cargar el osito", err));

  function posicionPortada() {
    const vertical = window.innerHeight > window.innerWidth;
    ancla.position.set(0, vertical ? -0.35 : -0.6, -3.3);
  }
  posicionPortada();

  // ---------- Estrellas ----------
  function geometriaEstrella() {
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 1 : 0.45, a = i * Math.PI / 5 + Math.PI / 2;
      i === 0 ? s.moveTo(Math.cos(a) * r, Math.sin(a) * r) : s.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: true, bevelSize: 0.14, bevelThickness: 0.14, bevelSegments: 3 });
    geo.center(); geo.scale(0.1, 0.1, 0.1);
    return geo;
  }
  const estrellaGeo = geometriaEstrella();
  const matEstrella = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.15, emissive: c, emissiveIntensity: 0.22, transparent: true });

  const flotantes = [];
  for (let i = 0; i < 30; i++) {
    const m = new THREE.Mesh(estrellaGeo, matEstrella(COLORES[i % COLORES.length]));
    const ang = Math.random() * Math.PI * 2, r = 4.5 + Math.random() * 6;
    m.position.set(Math.cos(ang) * r, -5 + Math.random() * 10, Math.sin(ang) * r);
    m.scale.setScalar(0.9 + Math.random() * 1.2);
    m.userData = { vel: 0.003 + Math.random() * 0.005, giro: (Math.random() - .5) * 0.03, fase: Math.random() * 6 };
    m.visible = false;
    scene.add(m); flotantes.push(m);
  }

  const chispas = [];
  function lanzarEstrellas(desde, n = 12) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(estrellaGeo, matEstrella(COLORES[Math.floor(Math.random() * COLORES.length)]));
      m.position.copy(desde);
      m.scale.setScalar(0.6 + Math.random() * 0.7);
      m.userData = { v: new THREE.Vector3((Math.random() - .5) * .09, Math.random() * .09 + .03, (Math.random() - .5) * .09), vida: 1 };
      scene.add(m); chispas.push(m);
    }
  }
  const frenteCamara = () => new THREE.Vector3(0, 0, -2.5).applyQuaternion(camera.quaternion);

  // ---------- Giroscopio ----------
  let orientacion = null, alphaInicial = null, usaGiroscopio = false;
  const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const rad = THREE.MathUtils.degToRad;
  function alGirar(e) {
    if (e.alpha == null) return;
    if (alphaInicial === null) alphaInicial = e.alpha;
    orientacion = e; usaGiroscopio = true;
  }
  function aplicarOrientacion() {
    const o = orientacion;
    const pantalla = rad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    euler.set(rad(o.beta), rad(o.alpha - alphaInicial), -rad(o.gamma), "YXZ");
    camera.quaternion.setFromEuler(euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -pantalla));
  }

  // Arrastrar con el dedo o el mouse (si no hay giroscopio)
  let yaw = 0, pitch = 0, arrastrando = false, px = 0, py = 0, movido = 0;
  canvas.addEventListener("pointerdown", e => { arrastrando = true; px = e.clientX; py = e.clientY; movido = 0; });
  window.addEventListener("pointermove", e => {
    if (!arrastrando) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    movido += Math.abs(dx) + Math.abs(dy);
    if (!usaGiroscopio && abierta) { yaw += dx * 0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.005)); }
    px = e.clientX; py = e.clientY;
  });
  window.addEventListener("pointerup", () => {
    if (arrastrando && movido < 10 && abierta) { lanzarEstrellas(frenteCamara()); if (navigator.vibrate) navigator.vibrate(20); }
    arrastrando = false;
  });

  // ---------- Cámara ----------
  async function iniciarCamara() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      const v = $("camara"); v.srcObject = stream; v.style.display = "block"; await v.play();
    } catch (err) { /* sin cámara: se queda el fondo de color */ }
  }

  // ---------- Mensaje ----------
  function escribirMensaje() {
    const el = $("texto"), txt = TARJETA.mensaje;
    if (quieto) { el.textContent = txt; $("firma").classList.add("visible"); return; }
    let i = 0;
    const t = setInterval(() => {
      el.textContent = txt.slice(0, ++i);
      if (i >= txt.length) { clearInterval(t); $("firma").classList.add("visible"); }
    }, 24);
  }
  $("boton-min").addEventListener("click", e => {
    const t = $("tarjeta");
    t.classList.toggle("minimizada");
    e.target.textContent = t.classList.contains("minimizada") ? "Ver mensaje" : "Ocultar";
  });
  $("tarjeta").addEventListener("pointerup", e => e.stopPropagation());

  // ---------- Realidad aumentada nativa ----------
  // iPhone/iPad: Quick Look con osito.usdz. Android: Scene Viewer con osito.glb.
  function prepararAR() {
    const zona = $("zona-ar");
    const esIOS = (() => { const a = document.createElement("a"); return a.relList && a.relList.supports && a.relList.supports("ar"); })();
    const esAndroid = /android/i.test(navigator.userAgent);
    const texto = "Pon el osito en tu escritorio 🧸";
    if (esIOS) {
      // Quick Look exige que el enlace contenga solo una imagen
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112"><rect width="640" height="112" rx="32" fill="#FF7A59"/><text x="320" y="68" font-family="-apple-system,Helvetica,sans-serif" font-size="34" font-weight="600" fill="#fff" text-anchor="middle">${texto}</text></svg>`;
      zona.innerHTML = `<a rel="ar" href="osito.usdz#allowsContentScaling=0"><img alt="${texto}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}"></a>`;
      zona.classList.add("lista");
    } else if (esAndroid) {
      const glb = new URL("osito.glb", location.href).href;
      const volver = encodeURIComponent(location.href);
      const intent = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glb) +
        "&mode=ar_preferred&title=" + encodeURIComponent("Osito para " + TARJETA.para) +
        "#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=" + volver + ";end;";
      zona.innerHTML = `<a class="boton" href="${intent}">${texto}</a>`;
      zona.classList.add("lista");
    }
  }
  prepararAR();

  // ---------- Abrir ----------
  let abierta = false, tAbierta = 0;
  $("boton-abrir").addEventListener("click", async () => {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        if (await DeviceOrientationEvent.requestPermission() === "granted") window.addEventListener("deviceorientation", alGirar);
      } else {
        window.addEventListener("deviceorientation", alGirar);
      }
    } catch (e) { /* sigue sin giroscopio */ }

    await iniciarCamara();
    $("portada").classList.add("oculta");
    abierta = true; tAbierta = performance.now();
    flotantes.forEach(m => m.visible = true);
    lanzarEstrellas(new THREE.Vector3(ancla.position.x, ancla.position.y + 1.4, ancla.position.z), 22);

    setTimeout(() => {
      $("pista").textContent = usaGiroscopio ? "Mueve tu celular para mirar alrededor 👀" : "Desliza el dedo para mirar alrededor 👀";
      $("pista").classList.add("visible");
      setTimeout(() => $("pista").classList.remove("visible"), 5000);
    }, 1400);
    setTimeout(() => { $("tarjeta").classList.add("visible"); escribirMensaje(); }, 1600);
  });

  // ---------- Animación ----------
  function animar(t) {
    requestAnimationFrame(animar);
    const s = t / 1000;
    if (usaGiroscopio && orientacion) aplicarOrientacion();
    else { camera.rotation.y = -yaw; camera.rotation.x = -pitch; }

    if (osito) {
      // Al abrir, el osito sube un poco para dejar espacio a la tarjeta
      const p = abierta ? Math.min(1, (t - tAbierta) / 1400) : 0, e = 1 - Math.pow(1 - p, 3);
      const vertical = window.innerHeight > window.innerWidth;
      const yBase = (vertical ? -0.35 : -0.6) + e * (vertical ? 0.1 : 0.2);
      ancla.position.y = yBase + (quieto ? 0 : Math.abs(Math.sin(s * 1.6)) * 0.06);
      if (!quieto) {
        osito.rotation.y = Math.sin(s * 0.6) * 0.3;
        osito.rotation.z = Math.sin(s * 1.6) * 0.03;
        if (brazo) brazo.rotation.z = 2.4 + Math.sin(s * 6) * 0.3;
      }
    }
    flotantes.forEach(m => {
      if (!quieto) { m.position.y += m.userData.vel; m.rotation.y += m.userData.giro; m.position.x += Math.sin(s + m.userData.fase) * 0.002; }
      if (m.position.y > 5.5) m.position.y = -5.5;
    });
    for (let i = chispas.length - 1; i >= 0; i--) {
      const c = chispas[i];
      c.position.add(c.userData.v); c.userData.v.y -= 0.0018; c.rotation.y += 0.1;
      c.userData.vida -= 0.011; c.material.opacity = Math.max(0, c.userData.vida);
      if (c.userData.vida <= 0) { scene.remove(c); c.material.dispose(); chispas.splice(i, 1); }
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animar);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

</body>
</html>
